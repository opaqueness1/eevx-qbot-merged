<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'none'"><link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="page.css"><style>html,body,#map{height:100%;margin:0;background:#19261f}.leaflet-tile-pane{filter:brightness(.55) saturate(.65)}.leaflet-control-attribution{background:#10251ee8!important;color:#e1ece5}.leaflet-control-attribution a{color:#99dcb7}.route-pin svg{position:absolute;left:0;top:0;z-index:0;filter:drop-shadow(0 1px 2px #000a)}.route-pin span{position:absolute;z-index:1;left:0;right:0;top:5px;text-align:center;font:700 11px/14px sans-serif;color:#08110d}.route-pin.selected span{font-size:12px}.route-dot{background:#79d9a8;border:1.5px solid #08110d;border-radius:50%;box-shadow:0 1px 2px #000a}.route-dot.selected{background:#edf2ee;border-color:#79d9a8}</style></head><body><div id="map" role="application" aria-label="Route map"></div><script src="leaflet.js"></script><script src="route.js"></script></body></html>
